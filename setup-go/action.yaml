name: 'Setup Go'
description: |
  This action sets up golang with the default version defined by the
  Knative project maintainers

inputs:
  go-version:
    description: |
      override the go version defined by the Knative project

    required: false
  cache:
    description: Whether to cache Go modules and build outputs.
    required: false
    default: 'true'
  cache-dependency-path:
    description: |
      Dependency file paths or glob patterns used for the Go cache key.
      Supports multiple paths separated by newlines.
    required: false

runs:
  using: "composite"
  steps:
    - name: setup go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version || '1.26' }}
        # Use the newest patch release, not an older one that the runner
        # image has cached.
        check-latest: true
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
